site:
  name: Coffee Hour
  site: "https://www.coffeehourchapala.com"
  base: "/"
  trailingSlash: false

  googleSiteVerificationId: zPW8h1VBQY46Y7q8TevVG7scD1H9yFP_ybN-9c3_LPk

# Default SEO metadata
metadata:
  title:
    default: Coffee Hour
    template: "%s — Cafeteria en Chapala"
  description: "Disfruta del mejor café en Chapala acompañado de repostería artesanal, pasteles caseros, brunchs deliciosos y postres gourmet. "
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Coffee Hour
    images:
      # - url: '~/assets/images/default.png'
      width: 1200
      height: 628
    type: website
  twitter:
    handle: "@onwidget"
    site: "@onwidget"
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: "/%slug%" # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: "blog" # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: "category" # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: "tag" # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-35PLSX9GLD # or "G-XXXXXXXXXX"
      partytown: false

ui:
  theme: "system" # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
